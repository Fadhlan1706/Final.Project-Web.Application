<!doctype html>
<html lang="id" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kelola Pengguna — SkillSwap Admin</title>
    <link rel="stylesheet" href="../../assets/css/variables.css" />
    <link rel="stylesheet" href="../../assets/css/global.css" />
    <link rel="stylesheet" href="../../assets/css/layout.css" />
    <link rel="stylesheet" href="../../assets/css/components.css" />
    <link rel="stylesheet" href="../../assets/css/icons.css" />
    <link rel="stylesheet" href="../../assets/css/modal-kanban.css" />
  </head>
  <body>
    <div class="app-shell" id="app-shell">
      <nav class="navbar">
        <div class="navbar-brand">
          <div class="brand-icon">
            <i
              class="icon icon-sm"
              data-icon="refresh-cw"
              data-color="primary"
            ></i>
          </div>
          <span class="brand-text"
            ><span>Skill<span>Swap</span></span>
            <span
              style="
                font-size: 0.6rem;
                background: var(--red);
                color: #fff;
                padding: 2px 6px;
                border-radius: 5px;
                margin-left: 4px;
              "
              >ADMIN</span
            ></span
          >
        </div>
        <button class="navbar-toggle" id="sidebar-toggle">
          <i class="icon" data-icon="menu" data-color="secondary"></i>
        </button>
        <div class="navbar-search">
          <span class="search-icon"
            ><i class="icon icon-sm c-muted" data-icon="search"></i></span
          ><input
            type="text"
            id="user-search"
            placeholder="Cari nama, email, jurusan..."
          />
        </div>
        <div class="navbar-actions">
          <button class="nav-btn" id="theme-toggle">
            <i class="icon icon-sm c-muted" data-icon="sun"></i>
          </button>
          <div class="profile-dropdown">
            <div class="profile-btn" id="profile-btn">
              <div
                class="profile-avatar"
                style="background: linear-gradient(135deg, var(--red), #ff8787)"
              >
                AD
              </div>
              <div>
                <div class="profile-name">Admin</div>
                <div class="profile-role">Administrator</div>
              </div>
              ▾
            </div>
            <div class="dropdown-menu" id="profile-menu">
              <div class="dropdown-divider"></div>
              <div class="dropdown-item danger" onclick="mockLogout()">
                <i class="icon icon-sm" data-icon="log-out"></i> Keluar
              </div>
            </div>
          </div>
        </div>
      </nav>

      <aside class="sidebar">
        <span class="sidebar-section-label">Panel Admin</span>
        <a class="nav-link" href="dashboard.html"
          ><span class="nav-icon"
            ><i class="icon icon-sm" data-icon="bar-chart-2"></i></span
          ><span class="nav-label">Overview</span></a
        >
        <a class="nav-link active" href="manage-users.html"
          ><span class="nav-icon"
            ><i class="icon icon-sm" data-icon="users"></i></span
          ><span class="nav-label">Kelola User</span></a
        >
        <a class="nav-link" href="categories.html"
          ><span class="nav-icon"
            ><i class="icon icon-sm" data-icon="tag"></i></span
          ><span class="nav-label">Kategori Skill</span></a
        >
        <a class="nav-link" href="reports.html"
          ><span class="nav-icon"
            ><i class="icon icon-sm" data-icon="flag"></i></span
          ><span class="nav-label">Laporan</span
          ><span class="nav-badge" style="background: var(--red)">3</span></a
        >
      </aside>

      <main class="main-content page-enter">
        <div class="page-header-row" style="margin-bottom: 20px">
          <div class="page-header" style="margin-bottom: 0">
            <h1>
              <i class="icon icon-sm" data-icon="users"></i> Kelola Pengguna
            </h1>
            <p>CRUD dan moderasi akun mahasiswa</p>
          </div>
          <div style="display: flex; gap: 10px; flex-wrap: wrap">
            <select
              class="form-control"
              id="filter-status"
              style="width: auto; min-width: 140px; font-size: 0.82rem"
            >
              <option value="">Semua Status</option>
              <option value="active">Aktif</option>
              <option value="suspended">Disuspend</option>
            </select>
            <button
              class="btn btn-primary"
              onclick="openModal('add-user-modal')"
            >
              + Tambah User
            </button>
          </div>
        </div>

        <div class="card">
          <div class="table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th>
                    <input
                      type="checkbox"
                      id="check-all"
                      style="accent-color: var(--accent)"
                    />
                  </th>
                  <th>Pengguna</th>
                  <th>Jurusan</th>
                  <th>Skill Utama</th>
                  <th>Kolaborasi</th>
                  <th>Rating</th>
                  <th>Status</th>
                  <th>Aksi</th>
                </tr>
              </thead>
              <tbody id="users-table-body"></tbody>
            </table>
          </div>
          <div
            style="
              padding: 14px 16px;
              display: flex;
              align-items: center;
              justify-content: space-between;
              border-top: 1px solid var(--border);
              font-size: 0.82rem;
              color: var(--text-muted);
            "
          >
            <span id="table-info">Menampilkan 6 pengguna</span>
            <div style="display: flex; gap: 6px">
              <button class="btn btn-secondary btn-sm">← Prev</button>
              <button class="btn btn-primary btn-sm">1</button>
              <button class="btn btn-secondary btn-sm">Next →</button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- User Detail Modal -->
    <div class="modal-overlay" id="user-detail-modal">
      <div class="modal">
        <div class="modal-header">
          <span class="modal-title"
            ><i class="icon icon-sm" data-icon="user"></i> Detail Pengguna</span
          >
          <button class="modal-close" data-close-modal="user-detail-modal">
            <i class="icon icon-sm" data-icon="x"></i>
          </button>
        </div>
        <div class="modal-body" id="user-detail-body"></div>
        <div class="modal-footer">
          <button
            class="btn btn-secondary"
            data-close-modal="user-detail-modal"
          >
            Tutup
          </button>
          <button class="btn btn-danger" id="btn-suspend-user">
            <i class="icon icon-sm" data-icon="x"></i> Suspend User
          </button>
        </div>
      </div>
    </div>

    <!-- Add User Modal -->
    <div class="modal-overlay" id="add-user-modal">
      <div class="modal">
        <div class="modal-header">
          <span class="modal-title">+ Tambah Pengguna</span>
          <button class="modal-close" data-close-modal="add-user-modal">
            <i class="icon icon-sm" data-icon="x"></i>
          </button>
        </div>
        <div class="modal-body">
          <form onsubmit="addUser(event)">
            <div class="two-col" style="gap: 12px">
              <div class="form-group">
                <label class="form-label">Nama Lengkap <span>*</span></label
                ><input
                  class="form-control"
                  id="new-name"
                  required
                  placeholder="Nama pengguna"
                />
              </div>
              <div class="form-group">
                <label class="form-label">Jurusan <span>*</span></label
                ><input
                  class="form-control"
                  id="new-major"
                  required
                  placeholder="Jurusan"
                />
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Email <span>*</span></label
              ><input
                class="form-control"
                type="email"
                id="new-email"
                required
                placeholder="email@mahasiswa.ac.id"
              />
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end">
              <button
                type="button"
                class="btn btn-secondary"
                data-close-modal="add-user-modal"
              >
                Batal
              </button>
              <button type="submit" class="btn btn-primary">+ Tambah</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div id="toast-container"></div>

    <script src="../../assets/js/theme.js"></script>
    <script src="../../assets/js/mock-data.js"></script>
    <script src="../../assets/js/icons.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script>
      let adminUsers = MOCK_USERS.map((u) => ({
        ...u,
        status: "active",
        email: u.name.toLowerCase().replace(" ", "") + "@unsrat.ac.id",
      }));
      let selectedUserId = null;

      function renderTable(users) {
        const tbody = document.getElementById("users-table-body");
        document.getElementById("table-info").textContent =
          `Menampilkan ${users.length} pengguna`;
        if (users.length === 0) {
          tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state" style="padding:28px">Tidak ada pengguna ditemukan</div></td></tr>`;
          return;
        }
        tbody.innerHTML = users
          .map(
            (u) => `
    <tr>
      <td><input type="checkbox" style="accent-color:var(--accent)"></td>
      <td>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="avatar" style="background:linear-gradient(135deg,${u.avatarColor},${u.avatarColor}99)">${u.initials}</div>
          <div>
            <div class="td-name">${u.name}</div>
            <div style="font-size:0.72rem;color:var(--text-muted)">${u.email}</div>
          </div>
        </div>
      </td>
      <td style="font-size:0.82rem;color:var(--text-secondary)">${u.major}</td>
      <td>
        <div style="display:flex;gap:5px;flex-wrap:wrap">
          ${u.skills
            .slice(0, 2)
            .map((s) => `<span class="badge badge-gray">${s.name}</span>`)
            .join("")}
        </div>
      </td>
      <td style="font-weight:600;text-align:center">${u.collaborationsCount}</td>
      <td><span style="color:var(--amber);font-weight:700"><i class="icon icon-xs c-amber" data-icon="star"></i> ${u.score}</span></td>
      <td>
        ${
          u.status === "active"
            ? '<span class="badge badge-green">Aktif</span>'
            : '<span class="badge badge-red">Disuspend</span>'
        }
      </td>
      <td>
        <div style="display:flex;gap:5px">
          <button class="btn btn-secondary btn-sm" onclick="viewUser(${u.id})" title="Detail"><i class="icon icon-sm" data-icon="eye"></i></button>
          ${
            u.status === "active"
              ? `<button class="btn btn-danger btn-sm" onclick="toggleSuspend(${u.id})" title="Suspend"><i class="icon icon-sm" data-icon="x"></i></button>`
              : `<button class="btn btn-success btn-sm" onclick="toggleSuspend(${u.id})" title="Aktifkan"><i class="icon icon-sm c-green" data-icon="check-circle"></i></button>`
          }
        </div>
      </td>
    </tr>
  `,
          )
          .join("");
      }

      function applyFilters() {
        const q = document.getElementById("user-search").value.toLowerCase();
        const s = document.getElementById("filter-status").value;
        let result = adminUsers.filter((u) => {
          const matchQ =
            !q ||
            u.name.toLowerCase().includes(q) ||
            u.major.toLowerCase().includes(q);
          const matchS = !s || u.status === s;
          return matchQ && matchS;
        });
        renderTable(result);
      }

      document
        .getElementById("user-search")
        .addEventListener("input", applyFilters);
      document
        .getElementById("filter-status")
        .addEventListener("change", applyFilters);
      document.getElementById("check-all").addEventListener("change", (e) => {
        document
          .querySelectorAll('#users-table-body input[type="checkbox"]')
          .forEach((cb) => (cb.checked = e.target.checked));
      });

      function viewUser(id) {
        selectedUserId = id;
        const u = adminUsers.find((x) => x.id === id);
        if (!u) return;
        document.getElementById("user-detail-body").innerHTML = `
    <div style="display:flex;gap:16px;align-items:flex-start;margin-bottom:20px">
      <div class="avatar avatar-lg" style="background:linear-gradient(135deg,${u.avatarColor},${u.avatarColor}99)">${u.initials}</div>
      <div style="flex:1">
        <div style="font-family:var(--font-display);font-size:1.2rem;font-weight:800">${u.name}</div>
        <div style="color:var(--text-muted);font-size:0.82rem">${u.major} · ${u.university}</div>
        <div style="color:var(--text-muted);font-size:0.78rem;margin-top:4px">${u.email}</div>
        <div style="margin-top:8px;display:flex;gap:8px">
          ${u.status === "active" ? '<span class="badge badge-green">Aktif</span>' : '<span class="badge badge-red">Disuspend</span>'}
        </div>
      </div>
    </div>
    <div style="display:flex;gap:20px;margin-bottom:16px">
      <div class="profile-stat"><div class="val" style="font-family:var(--font-display);font-weight:800;font-size:1.3rem">${u.collaborationsCount}</div><div style="font-size:0.72rem;color:var(--text-muted)">Kolaborasi</div></div>
      <div class="profile-stat"><div class="val" style="font-family:var(--font-display);font-weight:800;font-size:1.3rem;color:var(--amber)"><i class="icon icon-xs c-amber" data-icon="star"></i> ${u.score}</div><div style="font-size:0.72rem;color:var(--text-muted)">Rating</div></div>
      <div class="profile-stat"><div class="val" style="font-family:var(--font-display);font-weight:800;font-size:1.3rem">${u.reviewCount}</div><div style="font-size:0.72rem;color:var(--text-muted)">Ulasan</div></div>
    </div>
    <div style="font-size:0.82rem;color:var(--text-secondary);line-height:1.7;margin-bottom:16px">${u.bio}</div>
    <div style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);margin-bottom:8px">Skill</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px">
      ${u.skills.map((s) => `<span class="skill-tag">${s.name} <span class="badge badge-gray" style="font-size:0.6rem">${s.level}</span></span>`).join("")}
    </div>
  `;
        const suspendBtn = document.getElementById("btn-suspend-user");
        suspendBtn.textContent =
          u.status === "active"
            ? '<i class="icon icon-sm" data-icon="x"></i> Suspend User'
            : "Aktifkan User";
        suspendBtn.className =
          u.status === "active" ? "btn btn-danger" : "btn btn-success";
        suspendBtn.onclick = () => {
          toggleSuspend(id);
          closeModal("user-detail-modal");
        };
        openModal("user-detail-modal");
      }

      function toggleSuspend(id) {
        const u = adminUsers.find((x) => x.id === id);
        if (!u) return;
        u.status = u.status === "active" ? "suspended" : "active";
        const action =
          u.status === "suspended" ? "disuspend" : "diaktifkan kembali";
        showToast(
          `User ${u.status === "suspended" ? 'Disuspend <i class="icon icon-sm" data-icon="x"></i>' : 'Diaktifkan <i class="icon icon-sm c-green" data-icon="check-circle"></i>'}`,
          `${u.name} berhasil ${action}.`,
          u.status === "suspended" ? "error" : "success",
        );
        applyFilters();
      }

      function addUser(e) {
        e.preventDefault();
        const name = document.getElementById("new-name").value.trim();
        const major = document.getElementById("new-major").value.trim();
        const email = document.getElementById("new-email").value.trim();
        const colors = ["#5c7cfa", "#be4bdb", "#40c057", "#fab005", "#fa5252"];
        const newUser = {
          id: Date.now(),
          name,
          major,
          email,
          initials: name
            .split(" ")
            .map((w) => w[0])
            .join("")
            .slice(0, 2)
            .toUpperCase(),
          university: "Universitas Sam Ratulangi",
          bio: "-",
          score: 0,
          reviewCount: 0,
          collaborationsCount: 0,
          skills: [],
          wantToLearn: [],
          reviews: [],
          avatarColor: colors[Math.floor(Math.random() * colors.length)],
          status: "active",
        };
        adminUsers.unshift(newUser);
        closeModal("add-user-modal");
        e.target.reset();
        applyFilters();
        showToast(
          'User Ditambahkan <i class="icon icon-sm c-green" data-icon="check-circle"></i>',
          `${name} berhasil ditambahkan.`,
          "success",
        );
      }

      document.addEventListener("DOMContentLoaded", () =>
        renderTable(adminUsers),
      );
    </script>
  </body>
</html>
